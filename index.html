  <title>Reverse Mirror - 似ているのに、真逆。「もう一つの自分」を探す類型ツール</title>

<body>
  <nav class="top-nav">
    <div class="breadcrumb">
      <a href="https://mofu-mitsu.github.io/lab.html"><i class="ph ph-flask"></i> Niラボ</a> 
      <span><i class="ph ph-caret-right"></i></span>
      <span class="current">Reverse Mirror</span>
    </div>
    <a href="https://mofu-mitsu.github.io/twin-mirror/" class="twin-link" target="_blank">
      <i class="ph ph-mirror"></i> Twin Mirror（双子関係）はこちら
    </a>
  </nav>

  <header class="header">
    <div class="logo-icon"><i class="ph ph-arrows-out-line-horizontal"></i></div>
    <h1>Reverse Mirror</h1>
    <h2 class="catchphrase">
      似ているのに、真逆。<br>
      真逆なのに、どこか分かり合える。
    </h2>
    <p class="desc">
      Reverse Mirrorは、N/Sなどの共通する軸を残しながら、その他の構造を反転させて「もう一つの自分」を探す類型ツールです。<br>
      あなたのReverse Mirrorを探してみましょう。
    </p>
  </header>

  <main>
    <div id="export-container">
      
      <section class="input-section">
        <div class="hide-on-capture">
          <h3><i class="ph ph-user-circle"></i> あなたの自認を入力</h3>
          <p class="sub-desc">すべて埋めなくてもOK！分かるものだけ入力してね。</p>
        </div>
        
        <div class="form-grid">
          <div class="input-group">
            <label>MBTI</label>
            <input type="text" id="mbti" placeholder="例: INTJ" maxlength="4">
          </div>
          <div class="input-group">
            <label>Socionics</label>
            <input type="text" id="socionics" placeholder="例: LII">
          </div>
          <div class="input-group">
            <label>Psychosophy</label>
            <input type="text" id="psycho" placeholder="例: LVFE" maxlength="4">
          </div>
          <div class="input-group">
            <label>Enneagram</label>
            <input type="text" id="ennea" placeholder="例: 5W6" maxlength="3">
          </div>
          <div class="input-group">
            <label>Tritype</label>
            <input type="text" id="tritype" placeholder="例: 513" maxlength="3">
          </div>
          <div class="input-group">
            <label>Instincts (生得本能)</label>
            <input type="text" id="instinct" placeholder="例: SP/SO" maxlength="5">
          </div>
          <div class="input-group">
            <label>DCNH</label>
            <input type="text" id="dcnh" placeholder="例: N または NC" maxlength="2">
          </div>
          <div class="input-group">
            <label>Classic Jung</label>
            <input type="text" id="jung" placeholder="例: IT(N) または IT">
          </div>
          <div class="input-group">
            <label>Amatorica (アマトリカ)</label>
            <input type="text" id="amatorica" placeholder="例: FSEA" maxlength="4">
          </div>
          <div class="input-group">
            <label>Temporistics (テンポリスティックス)</label>
            <input type="text" id="tempo" placeholder="例: VBPN" maxlength="4">
          </div>
        </div>

        <button id="reverse-btn" class="reverse-btn hide-on-capture">
          <i class="ph ph-arrows-clockwise"></i> Reverse!
        </button>
      </section>

      <section id="result-section" class="result-section hidden">
        <div class="capture-area">
          <h3 style="text-align: center; margin-bottom: 20px;"><i class="ph ph-magic-wand"></i> Your Reverse Mirror</h3>
          <div class="reversi-board" id="result-board"></div>
        </div>
      </section>
      
    </div> 

    <div id="action-buttons-area" class="action-buttons hidden">
      <button id="save-btn" class="action-btn"><i class="ph ph-download-simple"></i> 画像として保存</button>
      <button id="share-btn" class="action-btn"><i class="ph ph-share-network"></i> シェアする</button>
    </div>

    <!-- スマホ長押し保存用モーダル -->
    <div id="image-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <p><i class="ph ph-hand-tap"></i> 画像を長押しして保存</p>
          <span id="modal-close" class="close-btn"><i class="ph ph-x"></i></span>
        </div>
        <div class="modal-body">
          <img id="modal-image" src="" alt="Reverse Mirror Result">
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
